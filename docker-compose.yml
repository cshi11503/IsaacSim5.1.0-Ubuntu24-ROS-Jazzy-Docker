services:
  isaac-sim:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ISAAC_SIM_VERSION: ${ISAAC_SIM_VERSION}
        ROS_DISTRO: ${ROS_DISTRO}

    image: casey-isaacsim:5.1.0-jazzy-ubuntu24
    container_name: casey-Drone-container

    runtime: nvidia

    environment:
      ACCEPT_EULA: "Y"
      PRIVACY_CONSENT: "Y"
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "all"
      RMW_IMPLEMENTATION: "rmw_fastrtps_cpp"

    network_mode: host
    ipc: host

    security_opt:
      - label=disable

    user: "1234:1234"

    working_dir: /isaac-sim

    volumes:
      - /home/cshi30/ACE_Lab/VLM_Drone_project

    entrypoint:
      - /isaac-sim/runheadless.sh

    command:
      - /bin/bash

    stdin_open: true
    tty: true

    restart: "no"
